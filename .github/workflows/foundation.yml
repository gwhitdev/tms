name: M02 foundation container acceptance

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      TMS_FOUNDATION_REPORT_DIR: ${{ github.workspace }}/test-results/foundation
      TMS_TESTED_SHA: ${{ github.sha }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.400'
      - name: Prepare limited-scope report directory
        run: mkdir -p test-results/foundation
      - name: Check acceptance-runner guards without Docker
        run: node scripts/test-foundation.mjs --self-test | tee test-results/foundation/runner-guards.log
      - name: Test installer authentication and configuration policies
        run: node --test --test-reporter=tap tests/installer-control.test.mjs | tee test-results/foundation/installer-control.tap
      - name: Test foundation readiness and configuration policies
        run: |
          dotnet restore tests/Tms.Foundation.Tests/Tms.Foundation.Tests.csproj --locked-mode
          dotnet run --project tests/Tms.Foundation.Tests/Tms.Foundation.Tests.csproj --configuration Release --no-restore | tee test-results/foundation/foundation-policy.log
      - name: Install the locked frontend toolchain
        working-directory: web
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
      - name: Test and build the React foundation and installer UI
        working-directory: web
        run: |
          pnpm test | tee ../test-results/foundation/frontend-tests.log
          pnpm build | tee ../test-results/foundation/frontend-build.log
      - name: Validate and exercise the actual isolated foundation stack
        run: node scripts/test-foundation.mjs --ci-disposable-access-reset | tee test-results/foundation/container-acceptance.log
      - name: Retain M02-T01 reports without automatic verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m02-t01-foundation-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-results/foundation/*.json
            test-results/foundation/*.log
            test-results/foundation/*.tap
          if-no-files-found: warn
          retention-days: 30
