name: tms-installer
services:
  installer:
    image: tms-installer:m02
    build: {context: .., dockerfile: deploy/installer.Dockerfile}
    restart: unless-stopped
    ports: ['127.0.0.1:8740:8740']
    environment: {CONTROL_ORIGIN: 'http://127.0.0.1:8740'}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - control-state:/control
      - database-secret:/secrets/database
      - migrator-secret:/secrets/migrator
      - api-secret:/secrets/api
      - worker-secret:/secrets/worker
      - storage-secret:/secrets/storage
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8740/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  control-state: {}
  database-secret: {name: tms-foundation-database-secret}
  migrator-secret: {name: tms-foundation-migrator-secret}
  api-secret: {name: tms-foundation-api-secret}
  worker-secret: {name: tms-foundation-worker-secret}
  storage-secret: {name: tms-foundation-storage-secret}
